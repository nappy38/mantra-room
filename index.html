<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>真言の部屋</title>
<meta name="theme-color" content="#1f2433">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2433'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23c9a45c' stroke-width='3'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#1f2433; --bg2:#161a26; --card:#272d40; --ink:#ece6d6; --sub:#9aa0b4;
  --line:#3a4157; --gold:#c9a45c; --gold-d:#a8853f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--ink); display:flex; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
#app{ width:100%; max-width:460px; min-height:100dvh; display:flex; flex-direction:column; }
header{ text-align:center; padding:calc(18px + env(safe-area-inset-top)) 16px 6px; }
header .title{ font-size:18px; letter-spacing:.3em; color:var(--gold); }
header .sub{ font-size:11px; color:var(--sub); margin-top:4px; letter-spacing:.2em; }
.stage{ flex:1; display:flex; flex-direction:column; align-items:center; gap:14px; padding:10px 22px; }
#player{ display:none; width:100%; max-height:46vh; object-fit:contain; aspect-ratio:16/9; border-radius:12px; background:#000; }
.ring{ width:150px; height:150px; border-radius:50%; margin:18px 0 6px; border:1px solid var(--gold-d);
  display:flex; align-items:center; justify-content:center; font-size:56px; color:var(--gold);
  box-shadow:0 0 40px rgba(201,164,92,.18), inset 0 0 24px rgba(201,164,92,.08); }
.tracktitle{ text-align:center; }
.tracktitle .name{ font-size:16px; line-height:1.5; }
.tracktitle .desc{ font-size:11.5px; color:var(--sub); margin-top:3px; }
.tracklist{ display:flex; flex-direction:column; gap:6px; width:100%; }
.trackrow{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px;
  border:1px solid var(--line); background:var(--card); cursor:pointer; }
.trackrow.active{ border-color:var(--gold); }
.trackrow .num{ color:var(--gold); }
.trackrow .meta{ flex:1; min-width:0; }
.trackrow .t{ font-size:13px; }
.trackrow .d{ font-size:10.5px; color:var(--sub); }
.controls{ background:var(--card); border-radius:24px 24px 0 0; padding:14px 22px calc(16px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:12px; }
.seekrow,.row{ display:flex; align-items:center; gap:8px; }
.time{ font-size:10.5px; color:var(--sub); width:34px; }
.time.right{ text-align:right; }
.row label{ font-size:11px; color:var(--sub); width:36px; }
input[type=range]{ flex:1; -webkit-appearance:none; height:4px; border-radius:2px; background:var(--line); outline:none; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--gold); }
.playrow{ display:flex; align-items:center; justify-content:center; gap:24px; }
.iconbtn{ border:none; background:none; color:var(--sub); font-size:18px; cursor:pointer; width:40px; height:40px; }
#playBtn{ width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; background:var(--gold); color:#1f2433; font-size:21px; }
.switch{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sub); }
.switch input{ accent-color:var(--gold); }
.status{ text-align:center; font-size:10.5px; color:var(--sub); min-height:13px; }
.localpanel{ margin:14px 16px 0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.localpanel summary{ cursor:pointer; color:var(--sub); font-size:13px; list-style:none; }
.localpanel summary::-webkit-details-marker{ display:none }
.localpanel summary::before{ content:"＋ "; color:var(--gold); }
.localpanel[open] summary::before{ content:"− "; }
.lnote{ color:var(--sub); font-size:12px; line-height:1.75; margin:10px 0; }
.lrow{ display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); }
.lname{ flex:1; font-size:13px; }
.lstate{ font-size:11px; color:var(--sub); white-space:nowrap; }
.lstate.on{ color:var(--gold); }
.lbtn{ padding:5px 10px; border:1px solid var(--line); border-radius:9px; background:transparent; color:var(--ink); font-family:inherit; font-size:12px; cursor:pointer; }
.lmsg{ font-size:12px; color:var(--gold); min-height:17px; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">真言の部屋</div>
    <div class="sub">真言・お経</div>
  </header>

  <div class="stage">
    <video id="player" playsinline webkit-playsinline preload="metadata"></video>
    <div class="ring" id="ring">卍</div>
    <div class="tracktitle">
      <div class="name" id="trackName"></div>
      <div class="desc" id="trackDesc"></div>
    </div>
    <div class="tracklist" id="tracklist"></div>
  </div>

  <details class="localpanel">
    <summary>音源を端末に置く</summary>
    <p class="lnote">音源はアプリには入っていません。ここで選ぶと<b>この端末の中だけ</b>に保存され、オフラインでも鳴ります。公開しても、音源が誰かに渡ることはありません。</p>
    <div id="localSlots"></div>
    <input type="file" id="slotFile" style="display:none">
    <div class="lmsg" id="localMsg"></div>
  </details>

  <div class="controls" style="margin-top:14px">
    <div class="seekrow">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span class="time right" id="durTime">0:00</span>
    </div>
    <div class="playrow">
      <button class="iconbtn" id="prevBtn">❮❮</button>
      <button id="playBtn">▶</button>
      <button class="iconbtn" id="nextBtn">❯❯</button>
    </div>
    <div class="row"><label>音量</label><input type="range" id="volume" min="0" max="100" value="80"></div>
    <label class="switch"><input type="checkbox" id="autoNext" checked>連続再生</label>
    <div class="status" id="status">タップして再生</div>
  </div>
</div>

<script>
/* 曲を増やすときはここに1行足す。file の名前がそのまま端末への取り込みキーになる。
   動画なら video:true。 */
const TRACKS = [
  { file:"audio/11-movie.mp4",        num:"①", video:true,  name:"真言All",   desc:"動画／3分59秒" },
  { file:"audio/12b2-fudo-x15.mp4", num:"②", video:true, name:"不動明王 1.5倍速", desc:"のうまく さんまんだ ばざらだん せんだん まかろしゃだ そわたや うんたらた かんまん／動画／42秒" },
  { file:"audio/12c-aizen.mp4", num:"③", video:true, name:"愛染明王", desc:"おん まからぎゃ ばぞろうしゅにしゃ ばざらさとば じゃく うん ばん こく／動画／1分11秒" },
  { file:"audio/12-audio2.mp3",       num:"④", name:"えびす様", desc:"オン・インダラヤ・ソワカ／30秒" },
  { file:"audio/14-shichi-bongo.mp4", num:"⑤", video:true, name:"七梵語",   desc:"動画／1分" },
  { file:"audio/15-asa-otsutome.mp4", num:"⑥", video:true, name:"朝のお勤め", desc:"動画／50秒" },
  { file:"audio/16-shichi-bongo-kanzen.m4a", num:"⑦", name:"完整副住持 四智梵語", desc:"本覚院／2分58秒" },
  { file:"audio/17-jishorei-godaigan.m4a", num:"⑧", name:"次唱禮 + 五大願 全", desc:"本覚院／14分33秒" },
  { file:"audio/18-butsusan.m4a", num:"⑨", name:"佛讚", desc:"本覚院／2分2秒" },
  { file:"audio/19-fudo-bongo.m4a", num:"⑩", name:"不動梵語", desc:"本覚院／2分1秒" },
  { file:"audio/20-shinryaku-bongo.m4a", num:"⑪", name:"心略梵語", desc:"本覚院／3分6秒" },
];

/* 音源はアプリに入れず、端末のIndexedDBにだけ置く */
const BDB='mantraRoomAudio';
function bdb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(BDB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function bPut(key,blob){
  const db=await bdb();
  return new Promise((res,rej)=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').put(blob,key); t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); });
}
async function bGet(key){
  try{ const db=await bdb();
    return await new Promise(res=>{ const q=db.transaction('files','readonly').objectStore('files').get(key); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); });
  }catch(e){ return null; }
}
async function bDel(key){
  try{ const db=await bdb();
    await new Promise(res=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').delete(key); t.oncomplete=res; t.onerror=res; });
  }catch(e){}
}
const BHAVE='mantraRoomHave';
function bHave(k){ try{ return (JSON.parse(localStorage.getItem(BHAVE)||'{}'))[k]||null; }catch(e){ return null; } }
function bHaveSet(k,v){
  let o={}; try{ o=JSON.parse(localStorage.getItem(BHAVE)||'{}'); }catch(e){}
  if(v) o[k]=v; else delete o[k];
  try{ localStorage.setItem(BHAVE,JSON.stringify(o)); }catch(e){}
}
const tkey = t => t.file.replace(/^audio\//,'').replace(/\.(mp3|mp4|m4a)$/i,'');

const player=document.getElementById("player");
const $=id=>document.getElementById(id);
const trackNameEl=$("trackName"), trackDescEl=$("trackDesc"), tracklistEl=$("tracklist");
const playBtn=$("playBtn"), seekEl=$("seek"), curTimeEl=$("curTime"), durTimeEl=$("durTime");
const volumeEl=$("volume"), autoNextEl=$("autoNext"), statusEl=$("status"), ringEl=$("ring");
let trackIndex=0, isSeeking=false, curObjUrl=null;
player.volume=volumeEl.value/100;

function fmt(sec){ if(!isFinite(sec)||sec<0) sec=0; return Math.floor(sec/60)+":"+String(Math.floor(sec%60)).padStart(2,"0"); }

async function setTrackSrc(t){
  if(curObjUrl){ try{ URL.revokeObjectURL(curObjUrl); }catch(e){} curObjUrl=null; }
  const blob=await bGet(tkey(t));
  if(blob){ curObjUrl=URL.createObjectURL(blob); player.src=curObjUrl; }
  else { player.src=t.file; }
}
function renderTracklist(){
  tracklistEl.innerHTML="";
  TRACKS.forEach((t,i)=>{
    const row=document.createElement("div");
    row.className="trackrow"+(i===trackIndex?" active":"");
    row.innerHTML=`<span class="num">${t.num}</span><span class="meta"><div class="t">${t.name}</div><div class="d">${t.desc}</div></span>`;
    row.onclick=()=>loadTrack(i,true);
    tracklistEl.appendChild(row);
  });
}
function updateTrackInfo(){
  const t=TRACKS[trackIndex];
  trackNameEl.textContent=t.name; trackDescEl.textContent=t.desc;
  player.style.display=t.video?"block":"none";
  ringEl.style.display=t.video?"none":"";
  [...tracklistEl.children].forEach((el,i)=>el.classList.toggle("active",i===trackIndex));
}
async function loadTrack(i,autoplay){
  trackIndex=((i%TRACKS.length)+TRACKS.length)%TRACKS.length;
  await setTrackSrc(TRACKS[trackIndex]); updateTrackInfo();
  if(autoplay) play();
}
async function play(){
  const t=TRACKS[trackIndex];
  if(false){
    statusEl.textContent=`${t.num} ${t.name} は、まだこの端末に入っていません`;
    const panel=document.querySelector(".localpanel");
    panel.open=true; panel.scrollIntoView({behavior:"smooth",block:"center"});
    $("localMsg").textContent="下の「選ぶ」から、この曲のファイルを取り込んでください。";
    return;
  }
  try{ await player.play(); }catch(e){
    statusEl.textContent=`${t.num} ${t.name} は、まだこの端末に入っていません`;
    const panel=document.querySelector(".localpanel"); panel.open=true;
    $("localMsg").textContent="下の「選ぶ」から、この曲のファイルを取り込んでください。"; return; }
  playBtn.textContent="❚❚"; statusEl.textContent="再生中";
}
function pause(){ player.pause(); playBtn.textContent="▶"; statusEl.textContent="一時停止中"; }

playBtn.onclick=()=>{ player.paused?play():pause(); };
$("prevBtn").onclick=()=>loadTrack(trackIndex-1,!player.paused);
$("nextBtn").onclick=()=>loadTrack(trackIndex+1,!player.paused);
player.addEventListener("loadedmetadata",()=>{
  if(player.videoWidth) player.style.aspectRatio=player.videoWidth+" / "+player.videoHeight;
  seekEl.max=player.duration||0; durTimeEl.textContent=fmt(player.duration);
});
player.addEventListener("timeupdate",()=>{ if(isSeeking) return; seekEl.value=player.currentTime; curTimeEl.textContent=fmt(player.currentTime); });
player.addEventListener("ended",()=>{
  if(autoNextEl.checked && trackIndex<TRACKS.length-1) loadTrack(trackIndex+1,true);
  else { playBtn.textContent="▶"; statusEl.textContent="再生終了 — 合掌"; }
});
seekEl.addEventListener("input",()=>{ isSeeking=true; curTimeEl.textContent=fmt(seekEl.value); });
seekEl.addEventListener("change",()=>{ player.currentTime=Number(seekEl.value); isSeeking=false; });
volumeEl.addEventListener("input",()=>{ player.volume=volumeEl.value/100; });

renderTracklist(); loadTrack(0,false);
if("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });

/* 取り込みUI */
(function(){
  const slots=$("localSlots"), filePick=$("slotFile"), msg=$("localMsg");
  let pendingKey=null;
  const tell=t=>{ msg.textContent=t; };
  function render(){
    slots.innerHTML="";
    TRACKS.forEach(t=>{
      const k=tkey(t), have=bHave(k);
      const row=document.createElement("div"); row.className="lrow";
      row.innerHTML=`<div class="lname">${t.num} ${t.name}</div><div class="lstate${have?' on':''}">${have?'取り込み済み':'未取り込み'}</div>`;
      const pick=document.createElement("button"); pick.className="lbtn"; pick.textContent=have?"入れ直す":"選ぶ";
      pick.onclick=()=>{ pendingKey=k; filePick.value=""; filePick.accept="*/*"; filePick.click(); };
      row.appendChild(pick);
      if(have){
        const del=document.createElement("button"); del.className="lbtn"; del.textContent="消す";
        del.onclick=async()=>{
          if(!confirm(`${t.name} を、この端末から消します。よろしいですか？`)) return;
          await bDel(k); bHaveSet(k,null); render(); tell(`${t.name} を消しました。`);
        };
        row.appendChild(del);
      }
      slots.appendChild(row);
    });
  }
  filePick.onchange=async()=>{
    const f=filePick.files&&filePick.files[0];
    if(!f||!pendingKey) return;
    tell("取り込んでいます…");
    try{
      if(!f.size){ tell(`「${f.name}」は中身が空でした。転送が途中で終わっている可能性があります。`); pendingKey=null; return; }
      await bPut(pendingKey,f); bHaveSet(pendingKey,f.name); render();
      tell(`取り込みました（${(f.size/1048576).toFixed(1)}MB）。この端末の中だけに入っています。`);
      if(tkey(TRACKS[trackIndex])===pendingKey) await setTrackSrc(TRACKS[trackIndex]);
    }catch(e){ tell(`取り込めませんでした（${e&&e.name?e.name:"不明なエラー"}）。空き容量を確認してください。`); }
    pendingKey=null;
  };
  render();
  
})();
</script>
</body>
</html>
